follow_gap_node:
  ros__parameters:
    scan_topic: /scan
    drive_topic: /drive

    # LiDAR preprocessing
    forward_fov_deg: 220.0
    max_lidar_range: 12.0
    smoothing_window: 7

    # Gap selection
    gap_threshold: 0.95
    min_gap_points: 8
    car_width: 0.32
    safety_margin: 0.18
    disparity_threshold: 0.45
    bubble_radius: 0.45
    centerline_bias: 0.35
    target_distance: 4.0

    # Safety
    safety_front_angle_deg: 18.0
    emergency_stop_distance: 0.42
    caution_distance: 1.45
    reverse_clearance: 0.32

    # Driving
    max_speed: 4.0
    min_speed: 1.0
    corner_speed: 1.8
    max_steering_angle: 0.40
    steering_smoothing: 0.25
    recovery_speed: 0.7
    recovery_reverse_speed: -0.6
